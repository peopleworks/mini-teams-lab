<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniTeams</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login">
    <div class="card">
      <h1>💬 MiniTeams</h1>
      <p>Chat en tiempo real</p>
      <input id="name" placeholder="Tu nombre" autocomplete="off">
      <button id="enter">Entrar</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">💬 MiniTeams</div>
      <div class="label">CANALES</div>
      <div class="channel active"># general</div>
      <div class="label">EN LÍNEA <span id="count"></span></div>
      <ul id="users" class="users"></ul>
    </aside>
    <main class="main">
      <header class="head">
        <span># general</span>
        <div class="applause" title="Aplausómetro">
          <span class="applause-emoji">👏</span>
          <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
        </div>
      </header>
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>
      <div id="reactionBar" class="reaction-bar">
        <button class="react" data-emoji="👏" type="button">👏</button>
        <button class="react" data-emoji="❤️" type="button">❤️</button>
        <button class="react" data-emoji="🎉" type="button">🎉</button>
        <button class="react" data-emoji="🔥" type="button">🔥</button>
        <button class="react" data-emoji="😂" type="button">😂</button>
      </div>
      <form id="form" class="composer">
        <input id="text" placeholder="Escribe un mensaje…" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </main>
  </div>

  <!-- Capa de efectos: aquí flotan las reacciones y cae el confeti (no intercepta clics) -->
  <div id="fx" class="fx-layer"></div>

  <script src="https://unpkg.com/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
  <script src="call.js"></script>
  <script src="app.js"></script>
</body>
</html>
